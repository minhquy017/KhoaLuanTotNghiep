<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title-c2 desc-c2" fill="#18181B">
  <title id="title-c2">Cố Đô Huế — Concept 2: Spatial Hương</title>
  <desc id="desc-c2">Khúc lượn hình học của Sông Hương kết nối các điểm nút đồ thị không gian du lịch.</desc>
  <g id="symbol">
    <!-- Dòng chảy Sông Hương uốn lượn hình học dày 22px -->
    <path fill-rule="evenodd" d="
      M 72 44
      C 114 44 148 74 154 116
      C 160 156 182 176 212 176
      C 220 176 226 182 226 190
      C 226 198 220 204 212 204
      C 166 204 134 172 128 130
      C 122 92 100 72 72 72
      C 64 72 58 66 58 58
      C 58 50 64 44 72 44 Z
    " />

    <!-- Nhánh liên kết đồ thị đối xứng -->
    <path fill-rule="evenodd" d="
      M 184 212
      C 142 212 108 182 102 140
      C 96 100 74 80 44 80
      C 36 80 30 74 30 66
      C 30 58 36 52 44 52
      C 90 52 122 84 128 126
      C 134 164 156 184 184 184
      C 192 184 198 190 198 198
      C 198 206 192 212 184 212 Z
    " />

    <!-- Ba điểm nút Không gian chính (Spatial Waypoint Nodes) -->
    <!-- Node 1: Thượng nguồn -->
    <circle cx="58" cy="58" r="16" />
    <circle cx="58" cy="58" r="7" fill="#FFFFFF" />

    <!-- Node 2: Trọng tâm Cố Đô Huế -->
    <circle cx="128" cy="128" r="22" />
    <circle cx="128" cy="128" r="9" fill="#FFFFFF" />

    <!-- Node 3: Hạ lưu Thuận An -->
    <circle cx="198" cy="198" r="16" />
    <circle cx="198" cy="198" r="7" fill="#FFFFFF" />
  </g>
</svg>
